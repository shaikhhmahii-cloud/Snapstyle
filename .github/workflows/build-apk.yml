name: Build SnapStyle Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release SnapStyle APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/SnapStyle.apk
          ls -la release-apk/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapStyle-v1.0.0-APK
          path: release-apk/SnapStyle.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "SnapStyle Android APK v1.0.0"
          body: |
            ### SnapStyle Mobile Android App
            Download and install **SnapStyle.apk** on your Android smartphone.

            #### Features:
            - Native Camera and Photo Picker support for instant outfit capture
            - DeepFashion2 & YOLOv8 dual ensemble fashion object detection
            - CLIP + FAISS visual similarity search over 105+ fashion products
            - Fast, responsive Google Stitch-inspired UI
            - Offline reconnect handling & customizable backend endpoint
          files: release-apk/SnapStyle.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
